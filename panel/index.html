<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Civit Prompts Hub</title>
<link rel="stylesheet" href="/cph/panel.css" />
</head>
<body>

<header class="bar">
  <h1>Civit Prompts Hub</h1>
  <div class="bar-right">
    <span id="status" class="status">就绪</span>
    <span id="token-state" class="pill">token: 检测中</span>
    <span id="proxy-state" class="pill">proxy: -</span>
  </div>
</header>

<div id="banner" class="banner" hidden>
  <span id="banner-text"></span>
  <button id="banner-retry">重试</button>
</div>

<main>
  <!-- ---------------- left: browse ---------------- -->
  <section class="pane browse">
    <details class="filters" open>
      <summary>筛选</summary>
      <div class="grid-form">
        <label>sort
          <select id="f-sort">
            <option>Most Reactions</option><option>Newest</option><option>Oldest</option>
            <option>Most Comments</option><option>Most Collected</option><option>Random</option>
          </select>
        </label>
        <label>period
          <select id="f-period">
            <option>Month</option><option>Day</option><option>Week</option>
            <option>Year</option><option>AllTime</option>
          </select>
        </label>
        <label>limit
          <input id="f-limit" type="number" min="1" max="200" value="50" />
        </label>
        <label>type
          <select id="f-type"><option>image</option><option>video</option></select>
        </label>
        <label class="author-cell">
          作者
          <button id="btn-author" type="button">未设置</button>
        </label>
        <label>modelId
          <input id="f-modelId" type="number" placeholder="可用下方搜索自动填入" />
        </label>
        <label>modelVersionId
          <input id="f-modelVersionId" type="number" placeholder="可选" />
        </label>
        <label>内容等级 (browsingLevel)
          <select id="f-level">
            <option value="1">None — 仅安全内容</option>
            <option value="3">Soft — 含 Soft</option>
            <option value="7">Mature — 含 Mature</option>
            <option value="15">X — 全部</option>
          </select>
        </label>
        <label>postId
          <input id="f-postId" type="number" placeholder="可选" />
        </label>
        <div class="pick-row">
          <div class="pick">
            <span class="pick-label">baseModels</span>
            <div id="f-baseModels" class="multi"></div>
          </div>
          <div class="pick">
            <span class="pick-label">tags</span>
            <div id="f-tags" class="multi"></div>
          </div>
        </div>
      </div>
      <div class="row">
        <button id="btn-fetch" class="primary">拉取</button>
        <label class="inline"><input id="f-withMeta" type="checkbox" checked /> 带 metadata</label>
        <label class="inline"><input id="f-only-prompt" type="checkbox" checked /> 不显示没有 prompt 的图</label>
        <label class="inline"><input id="f-bm-all" type="checkbox" /> base model 显示全部（含视频/音频/3D）</label>
        <label class="inline"><input id="f-bm-none" type="checkbox" /> 清空 base model</label>
      </div>
      <div class="row">
        <button id="btn-whoami">检测 token</button>
        <span id="whoami-result" class="muted"></span>
      </div>
    </details>

    <details>
      <summary>按模型名查找（免手填 ID）</summary>
      <div class="row">
        <input id="m-query" type="text" placeholder="模型名，例如 krea 2 / pony / flux" style="flex:1" />
        <button id="m-search">搜索</button>
      </div>
      <div id="m-results" class="m-list"></div>
      <div id="m-versions-wrap" hidden>
        <div class="row"><strong class="muted" id="m-versions-title"></strong>
          <button id="m-versions-close">收起</button>
        </div>
        <div id="m-versions" class="m-list"></div>
      </div>
    </details>

    <div class="row">
      <span id="count">已加载 0 张</span>
      <button id="btn-select-all">全选已加载</button>
      <button id="btn-select-none">清空选择</button>
      <span id="selected-count" class="pill strong">已选 0</span>
    </div>

    <div id="grid" class="grid"></div>
    <div class="row pager">
      <button id="pg-first" title="第一页">«</button>
      <button id="pg-prev">上一页</button>
      <span class="pager-label">第 <span id="pg-cur">1</span> / <span id="pg-total">1</span> 页</span>
      <button id="pg-next">下一页</button>
      <button id="pg-last" title="最后一页">»</button>
      <span class="pager-jump">
        跳到第 <input id="pg-input" type="number" min="1" value="1" style="width:64px" /> 页
        <button id="pg-go">跳转</button>
      </span>
    </div>
  </section>

  <!-- ---------------- right: tasks ---------------- -->
  <section class="pane tasks">
    <details open>
      <summary>网络</summary>
      <div class="checks">
        <label><input id="n-browser-mode" type="checkbox" /> 浏览器直连模式（需浏览器开着代理；服务端不参与拉取）</label>
        <label><input id="n-proxy-enabled" type="checkbox" /> 服务端代理（仅服务端拉取时生效，改动无需重启 ComfyUI）</label>
      </div>
      <div class="grid-form">
        <label class="wide">代理地址（留空 = 自动用系统探测到的）
          <input id="n-proxy-url" type="text" placeholder="http://127.0.0.1:7890" />
        </label>
      </div>
      <div class="row">
        <button id="btn-proxy-save">保存代理设置</button>
        <span id="proxy-detected" class="muted"></span>
      </div>
      <div class="grid-form" id="author-row" hidden>
        <label class="half">作者（填用户名或数字 ID，会自动判断）
          <input id="f-author" type="text" placeholder="例如 Daddies 或 187111" autocomplete="off" />
        </label>
      </div>
      <div class="grid-form token-row" id="token-row" hidden>
        <label class="half">临时 token（只在本次会话生效，覆盖配置文件里的）
          <input id="f-token" type="password" placeholder="粘贴 Civitai API token" autocomplete="off" />
        </label>
      </div>
      <div class="row">
        <button id="btn-token-save">把 token 写入配置文件</button>
        <button id="btn-token-clear">清除配置文件里的 token</button>
        <button id="btn-token-edit">临时 token…</button>
        <span id="token-detail" class="muted"></span>
      </div>
      <div class="row">
        <span id="mode-detail" class="muted"></span>
      </div>
    </details>

    <details open>
      <summary>保存 Civitai 原始素材</summary>
      <div class="checks">
        <label><input id="s-image" type="checkbox" checked /> 下载原图</label>
        <label><input id="s-workflow" type="checkbox" checked /> 保存 workflow JSON</label>
        <label><input id="s-meta" type="checkbox" checked /> 保存 metadata</label>
        <label><input id="s-manifest" type="checkbox" checked /> 写 manifest.jsonl</label>
      </div>
      <div class="row">
        <button id="btn-save">保存所选</button>
        <span id="save-result" class="muted"></span>
      </div>
    </details>

    <details open>
      <summary>送入工作流节点</summary>
      <div class="row">
        <button id="btn-send" class="primary">写入 CPH Prompt List</button>
        <span class="muted">需要画布里存在该节点</span>
      </div>
    </details>

    <details open>
      <summary>批量生成</summary>
      <div class="grid-form">
        <label>注入方式
          <select id="t-inject">
            <option value="">（自动检测）</option>
            <option value="cph">CivitPromptList 节点（保留工作流开关逻辑）</option>
            <option value="clip">直接改写 CLIPTextEncode.text</option>
          </select>
        </label>
        <label>正向 CLIPTextEncode
          <select id="t-positive"></select>
        </label>
        <label>负向节点
          <select id="t-negative"></select>
        </label>
        <label>SaveImage 节点
          <select id="t-save"></select>
        </label>
        <label>种子节点
          <select id="t-seed"></select>
        </label>
        <label>队列深度
          <input id="t-depth" type="number" min="1" max="100" value="10" />
        </label>
        <label>输出子目录前缀
          <input id="t-prefix" type="text" value="cph_runs" />
        </label>
      </div>
      <div class="row">
        <label class="inline"><input id="t-vary-seed" type="checkbox" checked /> 每条队列项换不同种子（否则图会完全重复）</label>
      </div>
      <div class="row">
        <span id="t-plan" class="muted">批量执行方式：等待画布工作流同步…</span>
      </div>
      <div class="row">
        <button id="btn-run" class="primary">开始执行</button>
        <button id="btn-stop">停止追加</button>
        <button id="btn-clear-queue">清空待发</button>
      </div>
      <div class="row">
        <label class="inline"><input id="t-skip-saved" type="checkbox" checked /> 跳过已保存过的 ID（<span id="t-saved-count">加载中</span>）</label>
        <label class="inline"><input id="t-dedupe" type="checkbox" checked /> 同批次内自动去重</label>
      </div>
      <div class="row">
        <span id="run-state" class="status">未运行</span>
        <span id="run-counts" class="muted">待发 0 · 进行 0 · 完成 0 · 失败 0</span>
      </div>
      <div id="run-log" class="log"></div>
    </details>
  </section>
</main>

<div id="viewer" class="viewer" hidden>
  <div id="viewer-backdrop" class="viewer-backdrop"></div>
  <div class="viewer-box" role="dialog" aria-modal="true" aria-label="原图查看">
    <div class="viewer-head">
      <span id="viewer-title" class="viewer-title"></span>
      <span class="viewer-actions">
        <a id="viewer-open" class="viewer-link" target="_blank" rel="noopener noreferrer">在 Civitai 打开 ↗</a>
        <button id="viewer-zoom" title="切换 1:1 原始大小（Z）">1:1</button>
        <button id="viewer-prev" title="上一张（←）">‹</button>
        <button id="viewer-next" title="下一张（→）">›</button>
        <button id="viewer-close" title="关闭（Esc）">✕</button>
      </span>
    </div>
    <div id="viewer-stage" class="viewer-stage"><img id="viewer-img" alt="" /></div>
    <div id="viewer-meta" class="viewer-meta"></div>
  </div>
</div>

<script src="/cph/panel.js"></script>
</body>
</html>
